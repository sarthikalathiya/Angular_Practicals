version: '3.3'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: nest-app
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/social_db?schema=public
      JWT_SECRET: df137d04-d6e6-475b-8179-7e65e44e7a33e4820c85-3559-44f2-b323-bd7805cccbf3
    ports:
      - '3000:3000'

volumes:
  pgdata:
