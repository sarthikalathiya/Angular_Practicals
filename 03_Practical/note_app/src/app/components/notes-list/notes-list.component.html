<div class="container">
  <h1 class="page-title">Notes App</h1>
  
  <!-- Add/Edit Note Form -->
  <div class="form-container">
    <h2 class="form-title">{{ editingNote ? 'Edit Note' : 'Add New Note' }}</h2>
    <div class="form-group">
      <label class="form-label">Title</label>
      <input 
        type="text" 
        [(ngModel)]="newNote.name" 
        placeholder="Enter note title"
        class="form-control"
      >
    </div>
    <div class="form-group">
      <label class="form-label">Content</label>
      <textarea 
        [(ngModel)]="newNote.content" 
        placeholder="Enter note content"
        class="form-control"
        rows="4"
      ></textarea>
    </div>
    <div class="button-group">
      <button 
        (click)="saveNote()" 
        class="btn btn-primary"
        [disabled]="!newNote.name.trim() || !newNote.content.trim()"
      >
        {{ editingNote ? 'Update' : 'Add' }} Note
      </button>
      @if (editingNote) {
        <button (click)="cancelEdit()" class="btn btn-secondary">
          Cancel
        </button>
      }
    </div>
  </div>

  <!-- Notes List -->
  <div class="notes-list">
    <div class="notes-list-header">
      <h2 class="notes-list-title">Your Notes</h2>
    </div>
    @for (note of notes; track note.id) {
      <div class="note-item" [class.deleting]="deletingNoteId === note.id">
        <a [routerLink]="['/note', note.id]" class="note-title" [class]="'status-' + note.status">
          {{ note.name }}
        </a>
        <div class="note-actions">
          <button (click)="editNote(note)" class="btn btn-sm btn-secondary">
            Edit
          </button>
          <button (click)="deleteNote(note.id)" class="btn btn-sm btn-danger">
            Delete
          </button>
        </div>
      </div>
    } @empty {
      <div class="note-item">
        <p class="text-gray-600">No notes yet. Create one above!</p>
      </div>
    }
  </div>
</div>
