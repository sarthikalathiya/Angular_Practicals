<div class="container mt-4">
  <h2>Add New User</h2>
  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="mt-4">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" formControlName="name"
        [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
      <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
        <div *ngIf="f['name'].errors['required']">Name is required</div>
      </div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" formControlName="email"
        [ngClass]="{ 'is-invalid': submitted && f['email'].errors }">
      <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
        <div *ngIf="f['email'].errors['required']">Email is required</div>
        <div *ngIf="f['email'].errors['email']">Email must be valid</div>
      </div>
    </div>

    <div class="mb-3">
      <label for="department" class="form-label">Department</label>
      <select class="form-control" id="department" formControlName="department"
        [ngClass]="{ 'is-invalid': submitted && f['department'].errors }">
        <option value="">Select Department</option>
        <option *ngFor="let dept of departments" [value]="dept.name">{{dept.name}}</option>
        <option value="new">+ Add New Department</option>
      </select>
      <div *ngIf="submitted && f['department'].errors" class="invalid-feedback">
        <div *ngIf="f['department'].errors['required']">Department is required</div>
      </div>
    </div>

    <div class="mb-3" *ngIf="showNewDepartment">
      <label for="newDepartment" class="form-label">New Department Name</label>
      <input type="text" class="form-control" id="newDepartment" formControlName="newDepartment"
        [ngClass]="{ 'is-invalid': submitted && f['newDepartment'].errors }">
      <div *ngIf="submitted && f['newDepartment'].errors" class="invalid-feedback">
        <div *ngIf="f['newDepartment'].errors['required']">New department name is required</div>
      </div>
    </div>

    <div class="mb-3">
      <label for="salary" class="form-label">Salary</label>
      <input type="number" class="form-control" id="salary" formControlName="salary"
        [ngClass]="{ 'is-invalid': submitted && f['salary'].errors }">
      <div *ngIf="submitted && f['salary'].errors" class="invalid-feedback">
        <div *ngIf="f['salary'].errors['required']">Salary is required</div>
        <div *ngIf="f['salary'].errors['min']">Salary must be greater than 0</div>
      </div>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" formControlName="password"
        [ngClass]="{ 'is-invalid': submitted && f['password'].errors }">
      <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
        <div *ngIf="f['password'].errors['required']">Password is required</div>
        <div *ngIf="f['password'].errors['pattern']">
          Password must be 8-16 characters with at least 1 number and 1 special character
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Add User</button>
  </form>
</div>
